plugins {
    id 'com.android.application'
}

android {
    namespace 'com.study.classcardhelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.study.studylens.shizuku'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.0-shizuku'
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Bundled Korean OCR (also handles Latin text on the same screen)
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'

    // Free on-device English -> Korean translation model (downloaded once on device)
    implementation 'com.google.mlkit:translate:17.0.3'

    // Shizuku official API. No AccessibilityService is used.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
