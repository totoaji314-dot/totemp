<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ARGUS ULTRA HOSTED</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f7f7f7;--muted:#8b8b8b;--panel:#151515;--line:#2b2b2b;--chip:#202020;--ok:#7be0a5;--bad:#ff7a7a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:50px;flex:0 0 50px;border-bottom:1px solid #171717;display:flex;align-items:center;justify-content:center;position:sticky;top:0;background:#000;z-index:20}
.brand{font-size:14px;font-weight:800;letter-spacing:.2em}
#engine{position:absolute;right:16px;font-size:11px;color:#777;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#new{position:absolute;left:12px;width:34px;height:34px;border:0;background:transparent;color:#ddd;border-radius:10px;font-size:21px}
main{flex:1;min-height:0;overflow-y:auto}
#chat{max-width:860px;margin:auto;padding:22px 18px 180px}
.empty{min-height:calc(100dvh - 220px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.empty h1{margin:0 0 10px;font-size:28px}.empty p{margin:0;color:#888;max-width:560px;line-height:1.65;font-size:14px}
.msg{margin:0 0 28px}.userRow{display:flex;justify-content:flex-end}.user{max-width:82%;background:#202020;border-radius:22px;padding:11px 15px;line-height:1.6;white-space:pre-wrap}
.aiRow{display:flex;gap:11px;align-items:flex-start}.avatar{width:27px;height:27px;flex:0 0 27px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:900;font-size:12px}
.ai{flex:1;min-width:0;font-size:15px;line-height:1.75;overflow-wrap:anywhere}
.task{border:1px solid #292929;background:#0d0d0d;border-radius:15px;padding:12px 13px}.taskTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.taskTitle{font-size:13px;font-weight:700}.taskId{font-size:10px;color:#606060}
.taskText{margin-top:6px;color:#9a9a9a;font-size:12px}.bar{height:4px;background:#232323;border-radius:999px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:#eee;width:8%;transition:width .25s}
.steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.step{font-size:10px;border:1px solid #242424;border-radius:999px;padding:4px 7px;color:#666}.step.on{color:#fff;border-color:#555}.step.done{color:#9ed6b0;border-color:#284733;background:#102016}
.err{color:var(--bad);margin-top:9px;font-size:12px}.retry{margin-top:9px;border:1px solid #444;background:#181818;color:#fff;border-radius:9px;padding:7px 10px;font-size:11px}
.ai pre{background:#0b0b0b;border:1px solid #2a2a2a;border-radius:13px;overflow:auto;margin:13px 0}.codeHead{padding:7px 9px;border-bottom:1px solid #262626;color:#888;font-size:11px;display:flex;justify-content:space-between;position:sticky;left:0}.ai pre code{display:block;padding:12px;white-space:pre;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
.cbtn{border:1px solid #333;background:#151515;color:#ddd;border-radius:7px;padding:4px 7px;font-size:10px;margin-left:5px}
.srcToggle{margin-top:10px;border:1px solid #2b2b2b;background:#080808;color:#aaa;border-radius:999px;padding:6px 9px;font-size:11px}.srcs{display:none;border-left:2px solid #222;padding-left:10px;margin-top:8px}.srcs.open{display:block}.src{font-size:11px;color:#888;margin:7px 0}.src a{color:#ddd;text-decoration:none}.ok{color:var(--ok)}.fail{color:var(--bad)}
.composerShell{position:fixed;left:0;right:0;bottom:0;padding:28px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 22%,#000);z-index:30}
.composer{max-width:860px;margin:auto;background:#151515;border:1px solid #2c2c2c;border-radius:25px;padding:8px 9px;display:flex;gap:8px;align-items:flex-end}
#input{flex:1;min-height:38px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:8px 3px;line-height:1.5}
#send{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:0;background:#fff;color:#000;font-size:19px;font-weight:800}
#send:disabled{opacity:.25}
#queueInfo{max-width:860px;margin:0 auto 7px;color:#777;font-size:11px;padding:0 8px}
@media(max-width:560px){#chat{padding:18px 13px 165px}.empty h1{font-size:24px}.user{max-width:88%}.aiRow{gap:9px}.avatar{width:24px;height:24px;flex-basis:24px}.composerShell{padding-left:9px;padding-right:9px}#engine{right:10px;max-width:45vw}}
</style>
</head>
<body>
<div id="app">
<header><button id="new">＋</button><div class="brand">ARGUS</div><div id="engine">기기 확인 중</div></header>
<main id="main"><div id="chat"><section class="empty" id="empty"><h1>무엇을 도와드릴까요?</h1><p>메시지는 절대 버리지 않습니다. 모델 준비 중이어도 대기열에 저장하고, 준비되면 순서대로 자동 처리합니다.</p></section></div></main>
<div class="composerShell"><div id="queueInfo"></div><div class="composer"><textarea id="input" rows="1" placeholder="ARGUS에게 메시지 보내기"></textarea><button id="send" disabled>↑</button></div></div>
</div>
<script type="module">
const $=s=>document.querySelector(s), chatEl=$("#chat"), main=$("#main"), input=$("#input"), send=$("#send"), engineLabel=$("#engine"), queueInfo=$("#queueInfo");
const STEP_ORDER=["queued","engine","analyze","research","generate","review"];
const STEP_LABEL={queued:"대기",engine:"AI 준비",analyze:"질문 분석",research:"웹 조사",generate:"답변 작성",review:"검토"};
const STORE="argus_hosted_v1";
let engine=null,enginePromise=null,webllm=null,working=false;
let state={messages:[],queue:[],engine:{status:"checking",label:"기기 확인 중",progress:0,model:null,error:null}};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({messages:state.messages,queue:state.queue.map(q=>({...q,running:false})),engine:{...state.engine,status:state.engine.status==="ready"?"ready":"idle"}}))}catch{}}
function restore(){try{const s=JSON.parse(localStorage.getItem(STORE)||"null");if(s){state.messages=Array.isArray(s.messages)?s.messages:[];state.queue=Array.isArray(s.queue)?s.queue:[];state.queue.forEach(q=>q.running=false)}}catch{}}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}
function scrollBottom(){requestAnimationFrame(()=>main.scrollTop=main.scrollHeight)}
function updateQueueInfo(){const n=state.queue.length+(working?1:0);queueInfo.textContent=n?`작업 ${n}개 처리 대기/진행 중`:""}
function setEngine(p){state.engine={...state.engine,...p};const e=state.engine;engineLabel.textContent=e.status==="ready"?`${e.model||"LOCAL"} 준비됨`:e.label+(e.progress?` ${Math.round(e.progress*100)}%`:"");persist();render()}
function modelLadder(){const mem=navigator.deviceMemory||6,a=[];if(mem>=12)a.push("Qwen3.5-4B-q4f16_1-MLC");if(mem>=8)a.push("Qwen3-4B-q4f16_1-MLC");if(mem>=5)a.push("Qwen3.5-2B-q4f16_1-MLC");a.push("Qwen3-1.7B-q4f16_1-MLC","Qwen3-0.6B-q4f16_1-MLC");return [...new Set(a)]}
async function ensureEngine(){if(engine)return engine;if(enginePromise)return enginePromise;enginePromise=(async()=>{if(!navigator.gpu)throw new Error("WebGPU를 사용할 수 없습니다. 최신 Chrome/ChromeOS에서 열어 주세요.");setEngine({status:"loading",label:"WebGPU 런타임 준비 중",progress:.01,error:null});webllm ||= await import("https://esm.run/@mlc-ai/web-llm");let last=null;for(const model of modelLadder()){try{setEngine({status:"loading",label:`${model.match(/(?:4B|2B|1\.7B|0\.6B)/)?.[0]||"로컬"} 모델 준비 중`,progress:.02,model});const eng=await webllm.CreateMLCEngine(model,{initProgressCallback:r=>{const p=Math.max(0,Math.min(1,r.progress||0));let label=r.text||"AI 모델 준비 중";if(/download|fetch|cache/i.test(label))label="AI 모델 다운로드 중";else if(/shader|compile|gpu/i.test(label))label="GPU 컴파일 중";setEngine({status:"loading",label,progress:p,model})}});engine=eng;setEngine({status:"ready",label:"준비됨",progress:1,model,error:null});return eng}catch(e){last=e;setEngine({status:"loading",label:"더 작은 모델로 자동 전환 중",progress:0,error:null})}}throw last||new Error("사용 가능한 로컬 모델을 준비하지 못했습니다.")})().catch(e=>{enginePromise=null;setEngine({status:"error",label:"AI 엔진 준비 실패",progress:0,error:String(e?.message||e)});throw e});return enginePromise}
function stripThink(t){return String(t||"").replace(/<think>[\s\S]*?<\/think>/gi,"").replace(/<think>[\s\S]*$/i,"").trim()}
async function ai(messages,max_tokens=1536){const eng=await ensureEngine();const run=eng.chat.completions.create({messages,temperature:.45,max_tokens,stream:false});const timer=new Promise((_,rej)=>setTimeout(()=>rej(new Error("AI 응답 시간 초과")),180000));const res=await Promise.race([run,timer]);const t=stripThink(res?.choices?.[0]?.message?.content||"");if(!t)throw new Error("AI가 빈 응답을 반환했습니다.");return t}
const SYSTEM=`너는 ARGUS다. 한국어로 자연스럽게 답한다. 코딩·게임 제작·디버깅·자료조사에 강하다. 내부 추론 과정은 노출하지 않는다. 구현 요청은 가능한 한 실행 가능한 전체 코드를 제공한다. 모르면 추측하지 말고 확인된 범위를 밝힌다.`;
function simple(q){return q.trim().length<24&&!/(코드|게임|만들|구현|오류|버그|검색|찾아|조사|최신|비교|문서|api|github|깃허브)/i.test(q)}
function needsResearch(q){return /(검색|찾아|조사|최신|자료|문서|github|깃허브|오류|버그|코딩|게임|만들|구현|비교)/i.test(q)}
function history(){return state.messages.filter(m=>m.role!=="task"&&m.text).slice(-8).map(m=>({role:m.role,content:m.text.slice(0,3500)}))}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function search(q){const e=encodeURIComponent(q);const groups=await Promise.allSettled([getJSON(`https://ko.wikipedia.org/w/api.php?action=query&list=search&srsearch=${e}&format=json&srlimit=5&origin=*`).then(d=>(d.query?.search||[]).map(x=>({title:x.title,url:`https://ko.wikipedia.org/wiki/${encodeURIComponent(x.title.replace(/ /g,"_"))}`}))),getJSON(`https://api.github.com/search/repositories?q=${e}&per_page=5&sort=stars`).then(d=>(d.items||[]).map(x=>({title:x.full_name,url:x.html_url}))),getJSON(`https://api.stackexchange.com/2.3/search/advanced?site=stackoverflow&pagesize=5&sort=relevance&q=${e}`).then(d=>(d.items||[]).map(x=>({title:x.title,url:x.link}))),getJSON(`https://api.openalex.org/works?search=${e}&per-page=4`).then(d=>(d.results||[]).map(x=>({title:x.title,url:x.primary_location?.landing_page_url||x.doi||x.id})))]);const all=[];groups.forEach(g=>{if(g.status==="fulfilled")all.push(...g.value)});const seen=new Set();return all.filter(x=>x.url&&!seen.has(x.url)&&seen.add(x.url)).slice(0,10)}
function dom(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch{return""}}
async function readPage(h){try{const r=await fetch(`https://r.jina.ai/${h.url}`);if(!r.ok)throw new Error("HTTP "+r.status);const t=await r.text();if(t.length<180)throw new Error("본문이 너무 짧음");return {...h,ok:true,domain:dom(h.url),text:t.slice(0,4500)}}catch(e){return {...h,ok:false,domain:dom(h.url),error:String(e?.message||e),text:""}}}
function setTask(id,p){const m=state.messages.find(x=>x.id===id);if(m){Object.assign(m,p);persist();render()}}
function taskSteps(step){return STEP_ORDER.map(s=>({s,label:STEP_LABEL[s],state:STEP_ORDER.indexOf(s)<STEP_ORDER.indexOf(step)?"done":s===step?"on":""}))}
async function processJob(job){setTask(job.taskId,{status:"running",step:"engine",label:"AI 모델 준비 중",detail:"메시지는 저장되어 있습니다. 모델 준비가 끝나면 자동으로 계속합니다."});await ensureEngine();setTask(job.taskId,{step:"analyze",label:"질문 분석 중",detail:"요청 종류와 필요한 작업을 판단하고 있습니다."});let sources=[],evidence="";if(needsResearch(job.text)&&!simple(job.text)){setTask(job.taskId,{step:"research",label:"웹 검색 중",detail:"공개 소스에서 후보를 수집하고 있습니다."});const hits=await search(job.text);let docs=[];for(let i=0;i<Math.min(6,hits.length);i++){setTask(job.taskId,{detail:`페이지 ${i+1}/${Math.min(6,hits.length)} 읽는 중`});docs.push(await readPage(hits[i]))}sources=docs;evidence=docs.filter(x=>x.ok).map((x,i)=>`[${i+1}] ${x.title}\nURL:${x.url}\n${x.text}`).join("\n\n")}setTask(job.taskId,{step:"generate",label:"답변 작성 중",detail:"수집한 문맥을 바탕으로 답변을 생성합니다."});let prompt=job.text+(evidence?`\n\n실제로 읽은 자료:\n${evidence}`:"");let answer=await ai([{role:"system",content:SYSTEM},...history(),{role:"user",content:prompt}],simple(job.text)?700:1800);if(!simple(job.text)){setTask(job.taskId,{step:"review",label:"검토 중",detail:"답변의 오류와 누락을 한 번 더 확인합니다."});try{const rev=await ai([{role:"system",content:"너는 엄격한 검토자다. 초안의 실제 오류나 누락만 짧게 지적한다. 문제가 없으면 OK만 답한다."},{role:"user",content:`요청:${job.text}\n\n초안:${answer.slice(0,6500)}`}],380);if(!/^ok\b/i.test(rev.trim()))answer=await ai([{role:"system",content:SYSTEM},{role:"user",content:`요청:${job.text}\n초안:${answer}\n검토:${rev}\n검토 문제를 반영한 최종 답변을 다시 작성해.`}],1800)}catch{}}state.messages=state.messages.filter(x=>x.id!==job.taskId);state.messages.push({id:uid(),role:"assistant",text:answer,sources});persist();render()}
async function worker(){if(working||!state.queue.length)return;working=true;updateQueueInfo();while(state.queue.length){const job=state.queue[0];try{await processJob(job);state.queue.shift()}catch(e){setTask(job.taskId,{status:"error",label:state.engine.status==="error"?"AI 엔진 준비 실패":"작업 실패",detail:String(e?.message||e),error:true});state.queue.shift()}persist();updateQueueInfo()}working=false;updateQueueInfo()}
function enqueue(text,retryTaskId=null){const userId=uid(),taskId=retryTaskId||uid();if(!retryTaskId)state.messages.push({id:userId,role:"user",text});if(retryTaskId){const old=state.messages.find(x=>x.id===retryTaskId);if(old)Object.assign(old,{status:"queued",step:"queued",label:"다시 시도 대기 중",detail:"작업 대기열에 다시 넣었습니다.",error:false})}else state.messages.push({id:taskId,role:"task",text:"",status:"queued",step:"queued",label:"대기 중",detail:"작업 대기열에 저장했습니다.",original:text});state.queue.push({id:uid(),text,taskId});persist();render();worker()}
function renderText(text,body){const re=/```([a-zA-Z0-9_+#.-]*)\n([\s\S]*?)```/g;let last=0,m;while((m=re.exec(text))){if(m.index>last){const d=document.createElement("div");d.textContent=text.slice(last,m.index);d.style.whiteSpace="pre-wrap";body.appendChild(d)}const pre=document.createElement("pre"),head=document.createElement("div");head.className="codeHead";head.innerHTML=`<span>${esc(m[1]||"code")}</span><span></span>`;const cp=document.createElement("button");cp.className="cbtn";cp.textContent="복사";cp.onclick=()=>navigator.clipboard.writeText(m[2]);head.lastChild.appendChild(cp);if(/html/i.test(m[1])||/<!doctype html|<html/i.test(m[2])){const run=document.createElement("button");run.className="cbtn";run.textContent="실행";run.onclick=()=>{const w=open("","_blank");if(w){w.document.write(m[2]);w.document.close()}};head.lastChild.appendChild(run)}const code=document.createElement("code");code.textContent=m[2];pre.append(head,code);body.appendChild(pre);last=m.index+m[0].length}if(last<text.length){const d=document.createElement("div");d.textContent=text.slice(last);d.style.whiteSpace="pre-wrap";body.appendChild(d)}}
function render(){chatEl.innerHTML="";if(!state.messages.length){chatEl.innerHTML='<section class="empty"><h1>무엇을 도와드릴까요?</h1><p>메시지는 절대 버리지 않습니다. 모델 준비 중이어도 대기열에 저장합니다.</p></section>'}for(const m of state.messages){const sec=document.createElement("section");sec.className="msg";if(m.role==="user"){sec.innerHTML='<div class="userRow"><div class="user"></div></div>';sec.querySelector(".user").textContent=m.text}else if(m.role==="task"){const row=document.createElement("div");row.className="aiRow";const av=document.createElement("div");av.className="avatar";av.textContent="A";const body=document.createElement("div");body.className="ai";const t=document.createElement("div");t.className="task";const steps=taskSteps(m.step||"queued");t.innerHTML=`<div class="taskTop"><span class="taskTitle">${esc(m.label||"작업 중")}</span><span class="taskId">#${m.id.slice(-5)}</span></div><div class="taskText">${esc(m.detail||"")}</div><div class="bar"><i style="width:${Math.max(8,(STEP_ORDER.indexOf(m.step)+1)/STEP_ORDER.length*100)}%"></i></div><div class="steps">${steps.map(x=>`<span class="step ${x.state}">${x.label}</span>`).join("")}</div>`;if(m.error){const er=document.createElement("div");er.className="err";er.textContent=m.detail||"작업 실패";const b=document.createElement("button");b.className="retry";b.textContent="다시 시도";b.onclick=()=>enqueue(m.original,m.id);t.append(er,b)}body.appendChild(t);row.append(av,body);sec.appendChild(row)}else{const row=document.createElement("div");row.className="aiRow",av=document.createElement("div");av.className="avatar";av.textContent="A";const body=document.createElement("div");body.className="ai";renderText(m.text||"",body);if(m.sources?.length){const b=document.createElement("button");b.className="srcToggle";b.textContent=`웹에서 확인한 출처 ${m.sources.filter(x=>x.ok).length}개`;const list=document.createElement("div");list.className="srcs";for(const s of m.sources){const d=document.createElement("div");d.className="src";d.innerHTML=`<span class="${s.ok?"ok":"fail"}">${s.ok?"읽기 성공":"읽기 실패"}</span> · ${esc(s.domain)}<br><a href="${esc(s.url)}" target="_blank">${esc(s.title||s.url)}</a>`;list.appendChild(d)}b.onclick=()=>list.classList.toggle("open");body.append(b,list)}row.append(av,body);sec.appendChild(row)}chatEl.appendChild(sec)}engineLabel.textContent=state.engine.status==="ready"?`${state.engine.model||"LOCAL"} 준비됨`:state.engine.label+(state.engine.progress?` ${Math.round(state.engine.progress*100)}%`:"");updateQueueInfo();scrollBottom()}
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px";send.disabled=!input.value.trim()});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();const t=input.value.trim();if(t){input.value="";input.dispatchEvent(new Event("input"));enqueue(t)}}});send.onclick=()=>{const t=input.value.trim();if(t){input.value="";input.dispatchEvent(new Event("input"));enqueue(t)}};$("#new").onclick=()=>{state.messages=[];state.queue=[];persist();render()};restore();render();setEngine({status:"checking",label:"기기 확인 중",progress:0});setTimeout(()=>ensureEngine().then(worker).catch(()=>{}),350);if(state.queue.length)setTimeout(worker,600);
</script>
</body>
</html>
